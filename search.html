<body class="bg-background text-on-surface font-body-md antialiased mb-20">
<header class="bg-surface border-b border-outline-variant fixed top-0 w-full z-50 h-16 flex justify-between items-center px-margin-mobile md:px-margin-desktop">
  <h1 class="font-headline-h5 text-headline-h5 font-bold text-primary">EduCheat</h1>
  <div class="flex items-center gap-sm">
    <button class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors p-sm rounded-full">notifications</button>
    <div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
      <img src="https://i.pinimg.com/736x/a0/c0/d9/a0c0d934c162b1594fcf1e46d9e3c305.jpg" alt="Profile" class="w-full h-full object-cover" />
    </div>
  </div>
</header>
<main class="pt-24 pb-lg max-w-7xl mx-auto px-margin-mobile md:px-margin-desktop">
  <section class="mb-3xl">
    <div class="relative group">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors">search</span>
      <input id="searchInput" class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all font-body-md text-on-surface shadow-sm" placeholder="Cari kursus, materi, atau tutor..." type="text" />
    </div>
  </section>
  <section class="mb-3xl">
    <div class="flex justify-between items-end mb-md">
      <h2 class="font-headline-h6 text-headline-h6 text-primary">Pencarian Terakhir</h2>
      <button id="clearAllBtn" class="text-label-sm font-label-sm text-secondary hover:underline transition-all">Hapus Semua</button>
    </div>
    <div id="recentSearches" class="flex gap-sm overflow-x-auto no-scrollbar py-xs">
    </div>
  </section>
  <section class="mb-4xl -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0">
    <div class="flex overflow-x-auto no-scrollbar gap-md pb-xs">
      <button class="category-chip flex-shrink-0 px-xl py-md bg-primary-container text-on-tertiary rounded-xl font-label-md shadow-sm border border-primary-container" data-category="All">Semua</button>
      <button class="category-chip flex-shrink-0 px-xl py-md bg-white text-on-surface-variant border border-outline-variant rounded-xl font-label-md shadow-sm hover:border-secondary hover:text-secondary transition-all" data-category="UI/UX Design">UI/UX Design</button>
      <button class="category-chip flex-shrink-0 px-xl py-md bg-white text-on-surface-variant border border-outline-variant rounded-xl font-label-md shadow-sm hover:border-secondary hover:text-secondary transition-all" data-category="Web Development">Web Development</button>
      <button class="category-chip flex-shrink-0 px-xl py-md bg-white text-on-surface-variant border border-outline-variant rounded-xl font-label-md shadow-sm hover:border-secondary hover:text-secondary transition-all" data-category="Data Science">Data Science</button>
      <button class="category-chip flex-shrink-0 px-xl py-md bg-white text-on-surface-variant border border-outline-variant rounded-xl font-label-md shadow-sm hover:border-secondary hover:text-secondary transition-all" data-category="Mobile Development">Mobile Development</button>
      <button class="category-chip flex-shrink-0 px-xl py-md bg-white text-on-surface-variant border border-outline-variant rounded-xl font-label-md shadow-sm hover:border-secondary hover:text-secondary transition-all" data-category="Machine Learning">Machine Learning</button>
    </div>
  </section>
  <section>
    <h2 class="font-headline-h4 text-headline-h4 text-primary mb-xl">Hasil Populer</h2>
    <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg"></div>
  </section>

<nav class="fixed bottom-0 left-0 w-full h-16 z-50 bg-white border-t border-gray-200 flex justify-around items-center px-4 pb-4 rounded-t-xl shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
  <a href="home.html" class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:text-secondary">
    <span class="material-symbols-outlined">home</span>
    <span class="font-label-sm text-xs">Home</span>
  </a>
  <a href="courses.html" class="flex flex-col items-center justify-center text-gray-500 transition-all hover:text-secondary">
    <span class="material-symbols-outlined">school</span>
    <span class="font-label-sm text-xs">Courses</span>
  </a>
  <a href="search.html" class="flex flex-col items-center justify-center text-primary font-bold transition-all">
    <span class="material-symbols-outlined">search</span>
    <span class="font-label-sm text-xs">Search</span>
  </a>
  <a href="profile.html" class="flex flex-col items-center justify-center text-gray-500 transition-all hover:text-secondary">
    <span class="material-symbols-outlined">person</span>
    <span class="font-label-sm text-xs">Profil</span>
  </a>

<script>
  const courses = [
    { title: 'Advanced UI Design: Editorial Systems', instructor: 'Prof. Sarah Jenks', price: 'Rp 240.000', rating: '4.9', reviews: '2.4k', category: 'UI/UX Design', badge: 'Terlaris', image: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80' },
    { title: 'Full Stack Architecture Patterns', instructor: 'Dr. Alan Turing', price: 'Gratis', rating: '4.8', reviews: '1.2k', category: 'Web Development', image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80' },
    { title: 'Data Storytelling for Executives', instructor: 'Michael Henderson', price: 'Rp 185.000', rating: '4.7', reviews: '950', category: 'Data Science', image: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=800&q=80' },
    { title: 'Modern Machine Learning Basics', instructor: 'Sophia Lian', price: 'Gratis', rating: '4.6', reviews: '1.1k', category: 'Machine Learning', image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80' },
    { title: 'Responsive Mobile App Interfaces', instructor: 'Nina Hartanto', price: 'Rp 150.000', rating: '4.8', reviews: '720', category: 'Mobile Development', image: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80' },
    { title: 'UX Research Basics', instructor: 'Dedi Susanto', price: 'Rp 90.000', rating: '4.5', reviews: '540', category: 'UI/UX Design', image: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80' }
  ];

  const initialRecent = [
    'Mastering React 18',
    'Data Science Python',
    'UX Research Basics'
  ];

  const searchInput = document.getElementById('searchInput');
  const resultsGrid = document.getElementById('resultsGrid');
  const recentSearches = document.getElementById('recentSearches');
  const clearAllBtn = document.getElementById('clearAllBtn');
  let selectedCategory = 'All';
  let recentQueries = [...initialRecent];

  function renderResults() {
    const query = searchInput.value.trim().toLowerCase();
    const filtered = courses.filter(course => {
      const matchesText = [course.title, course.instructor, course.category].some(value => value.toLowerCase().includes(query));
      const matchesCategory = selectedCategory === 'All' || course.category === selectedCategory;
      return matchesText && matchesCategory;
    });

    if (!filtered.length) {
      resultsGrid.innerHTML = '<div class="md:col-span-2 lg:col-span-3 bg-surface-container-lowest rounded-3xl border border-outline-variant p-lg text-center text-on-surface-variant">Tidak ada hasil untuk pencarian ini. Coba kata kunci lainnya.</div>';
      return;
    }

    resultsGrid.innerHTML = filtered.map(course => `
      <article class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition-all flex flex-col group">
        <div class="aspect-video w-full overflow-hidden relative">
          <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${course.image}" alt="${course.title}" />
          ${course.badge ? `<div class="absolute top-md left-md bg-white/90 backdrop-blur-sm px-md py-xs rounded-full shadow-sm"><span class="text-label-sm font-label-sm text-secondary">${course.badge}</span></div>` : ''}
        </div>
        <div class="p-lg flex flex-col flex-grow">
          <h3 class="font-headline-h6 text-headline-h6 text-primary mb-sm leading-tight">${course.title}</h3>
          <p class="text-body-sm text-on-surface-variant mb-md">Bersama ${course.instructor}</p>
          <div class="mt-auto flex justify-between items-center">
            <div class="flex items-center gap-xs">
              <span class="material-symbols-outlined text-secondary" style="font-size: 18px;">star</span>
              <span class="text-label-md font-label-md text-on-surface">${course.rating}</span>
              <span class="text-label-sm text-outline">(${course.reviews})</span>
            </div>
            <span class="text-headline-h6 text-headline-h6 text-secondary">${course.price}</span>
          </div>
        </div>
      </article>
    `).join('');
  }

  function renderRecentSearches() {
    recentSearches.innerHTML = recentQueries.map(query => `
      <div class="flex-shrink-0 flex items-center gap-xs bg-white border border-outline-variant px-md py-sm rounded-full shadow-sm hover:border-secondary transition-colors cursor-pointer group" data-query="${query}">
        <span class="text-body-sm font-body-sm text-on-surface-variant group-hover:text-primary">${query}</span>
        <span class="material-symbols-outlined text-sm text-outline hover:text-error transition-colors remove-chip" style="font-size: 16px;">close</span>
      </div>
    `).join('');

    recentSearches.querySelectorAll('.remove-chip').forEach(button => {
      button.addEventListener('click', event => {
        event.stopPropagation();
        const chip = event.target.closest('[data-query]');
        const query = chip.getAttribute('data-query');
        recentQueries = recentQueries.filter(item => item !== query);
        renderRecentSearches();
      });
    });

    recentSearches.querySelectorAll('[data-query]').forEach(chip => {
      chip.addEventListener('click', event => {
        if (event.target.classList.contains('remove-chip')) return;
        const query = chip.getAttribute('data-query');
        searchInput.value = query;
        updateRecentQueries(query);
        renderResults();
      });
    });
  }

  function updateRecentQueries(query) {
    if (!query) return;
    recentQueries = [query, ...recentQueries.filter(item => item.toLowerCase() !== query.toLowerCase())].slice(0, 5);
    renderRecentSearches();
  }

  function setupCategories() {
    document.querySelectorAll('.category-chip').forEach(button => {
      button.addEventListener('click', () => {
        selectedCategory = button.dataset.category;
        document.querySelectorAll('.category-chip').forEach(chip => {
          chip.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'border-primary-container');
          chip.classList.add('bg-white', 'text-on-surface-variant');
        });
        button.classList.remove('bg-white', 'text-on-surface-variant');
        button.classList.add('bg-secondary-container', 'text-on-secondary-container', 'border-primary-container');
        renderResults();
      });
    });
  }

  searchInput.addEventListener('input', () => renderResults());
  searchInput.addEventListener('blur', () => updateRecentQueries(searchInput.value.trim()));
  clearAllBtn.addEventListener('click', () => {
    recentQueries = [];
    renderRecentSearches();
  });

  renderRecentSearches();
  setupCategories();
  renderResults();
</script>
</body>
