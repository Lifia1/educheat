<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Saya - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-accent min-h-screen pb-20">
  <header class="bg-white p-4 sticky top-0">
    <h1 class="text-2xl font-bold text-primary">Catatan Saya</h1>
  </header>

  <main class="max-w-screen-xl mx-auto px-4 pt-4" id="notesList"></main>

  <div class="fixed bottom-6 right-6">
    <button onclick="addNote()" class="bg-primary text-white w-14 h-14 rounded-3xl text-3xl shadow-lg">+</button>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('notes')) || [
      {title:"Implementasi Binary Search Tree", date:"12 Okt 2023", content:"Poin penting..."}
    ];

    function renderNotes() {
      document.getElementById('notesList').innerHTML = notes.map((note, i) => `
        <div class="bg-white rounded-3xl p-5 mb-4">
          <h3 class="font-semibold">${note.title}</h3>
          <p class="text-xs text-gray-500">${note.date}</p>
          <p class="text-sm mt-2 line-clamp-2">${note.content}</p>
        </div>
      `).join('');
    }

    function addNote() {
      const title = prompt("Judul Catatan:");
      if (title) {
        notes.unshift({title, date: new Date().toLocaleDateString('id-ID'), content:"Isi catatan..."});
        localStorage.setItem('notes', JSON.stringify(notes));
        renderNotes();
      }
    }

    renderNotes();
  </script>
</body>
</html>
