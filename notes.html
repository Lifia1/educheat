<script>
        const storedNotes = JSON.parse(localStorage.getItem('educheat-notes') || 'null');
        let notes = storedNotes || [
            {id: 1, title: 'Implementasi Binary Search Tree', date: '12 Okt 2023', content: 'Poin penting dalam implementasi BST adalah struktur data pohon dan traversal secara rekursif.'},
            {id: 2, title: 'UX Research untuk Aplikasi Mobile', date: '18 Mei 2024', content: 'Gunakan observasi langsung dan wawancara semi-terstruktur untuk memahami perilaku pengguna.'}
        ];

        const notesList = document.getElementById('notesList');
        const addNoteBtn = document.getElementById('addNoteBtn');

        function saveNotes() {
            localStorage.setItem('educheat-notes', JSON.stringify(notes));
        }

        function renderNotes() {
            if (!notes.length) {
                notesList.innerHTML = '<div class="bg-surface-container-lowest rounded-3xl border border-outline-variant p-md text-center text-on-surface-variant">Belum ada catatan. Tambahkan catatan baru untuk mulai belajar.</div>';
                return;
            }
            notesList.innerHTML = notes.map(note => `
                <div class="bg-surface-container-lowest rounded-3xl border border-outline-variant p-md shadow-sm">
                    <div class="flex items-center justify-between gap-4">
                        <div>
                            <h2 class="font-headline-h6 text-headline-h6 text-primary">${note.title}</h2>
                            <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">${note.date}</p>
                        </div>
                        <button class="px-sm py-xs rounded-full border border-outline text-on-surface-variant text-label-sm" onclick="editNote(${note.id})">Edit</button>
                    </div>
                    <p class="font-body-md text-body-md text-on-surface-variant mt-4 line-clamp-3">${note.content}</p>
                </div>
            `).join('');
        }

        window.editNote = function(id) {
            const note = notes.find(item => item.id === id);
            if (!note) return;
            const title = prompt('Ubah judul catatan:', note.title);
            if (title === null) return;
            const content = prompt('Ubah isi catatan:', note.content);
            if (content === null) return;
            note.title = title;
            note.content = content;
            saveNotes();
            renderNotes();
        };

        addNoteBtn.addEventListener('click', () => {
            const title = prompt('Judul Catatan Baru:');
            if (!title) return;
            const content = prompt('Isi catatan:') || '';
            notes.unshift({
                id: Date.now(),
                title,
                date: new Date().toLocaleDateString('id-ID'),
                content
            });
            saveNotes();
            renderNotes();
        });

        renderNotes();
    </script>
