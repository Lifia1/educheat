<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EduCheat - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              secondary: "#2e685c",
              primary: "#051911",
              background: "#fcf9f8",
              surface: "#fcf9f8",
              "surface-container-low": "#f6f3f2",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#b0ecdc",
              "outline-variant": "#c2c8c3",
              "on-surface": "#1b1c1c",
              "on-surface-variant": "#424844",
              "primary-container": "#1a2e25",
              "on-primary": "#ffffff"
            },
            fontFamily: {
              headline: ["Playfair Display"],
              body: ["Inter"]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        body {
            background-image: url('https://i.pinimg.com/736x/05/6c/d9/056cd9b77ec945232d2f4d16dda9a74f.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 25, 17, 0.35);
            z-index: -1;
            pointer-events: none;
        }
        
        .glass-card {
            background: rgba(245, 245, 245, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(5, 25, 17, 0.15);
        }
        
        .input-field {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(46, 104, 92, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding-left: 2.75rem;
        }
        
        .input-field::placeholder {
            color: #a8aca8;
        }
        
        .input-field:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #2e685c;
            box-shadow: 0 0 0 3px rgba(46, 104, 92, 0.12);
            outline: none;
        }
        
        .input-field:disabled {
            background: rgba(240, 240, 240, 0.5);
            cursor: not-allowed;
        }
        
        .login-btn {
            background: linear-gradient(135deg, #2e685c 0%, #1a5844 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(46, 104, 92, 0.35);
        }
        
        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .checkbox-custom {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #2e685c;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background: white;
        }
        
        .checkbox-custom:hover {
            border-color: #1a5844;
            box-shadow: 0 0 0 2px rgba(46, 104, 92, 0.1);
        }
        
        .checkbox-custom:checked {
            background: #2e685c;
            border-color: #2e685c;
        }
        
        .checkbox-custom:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 12px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .error-message {
            color: #ba1a1a;
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: slideDown 0.3s ease;
        }
        
        .success-message {
            color: #2e685c;
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a8aca8;
            pointer-events: none;
            transition: color 0.3s ease;
            font-size: 1.25rem;
        }
        
        .input-field:focus ~ .input-icon {
            color: #2e685c;
        }
        
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #a8aca8;
            transition: all 0.2s ease;
            padding: 4px;
            border-radius: 4px;
        }
        
        .toggle-password:hover {
            color: #2e685c;
            background: rgba(46, 104, 92, 0.08);
        }
        
        .toggle-password .material-symbols-outlined {
            font-size: 1.25rem;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
</style>
</head>
<body class="font-body text-body overflow-x-hidden flex items-center justify-center min-h-screen px-4">
<main class="w-full max-w-md">
  <div class="glass-card rounded-3xl p-8 shadow-2xl fade-in">
    <!-- Header -->
    <div class="text-left mb-8">
      <h1 class="font-headline text-3xl text-primary mb-1 leading-tight">Login</h1>
      <p class="text-sm text-on-surface-variant">Welcome back please login to your account</p>
    </div>

    <form id="loginForm" class="space-y-5" novalidate>
      <!-- Username Field -->
      <div>
        <div class="relative">
          <span class="material-symbols-outlined input-icon">account_circle</span>
          <input 
            id="username" 
            name="username" 
            type="text" 
            placeholder="User Name" 
            class="input-field w-full h-12 rounded-xl text-on-surface text-sm" 
            required
            autocomplete="username"
            minlength="3"
          >
        </div>
        <div id="usernameError" class="error-message" style="display: none;"></div>
        <div id="usernameSuccess" class="success-message" style="display: none;"></div>
      </div>

      <!-- Password Field -->
      <div>
        <div class="relative">
          <span class="material-symbols-outlined input-icon">visibility</span>
          <input 
            id="password" 
            name="password" 
            type="password" 
            placeholder="Password" 
            class="input-field w-full h-12 pr-12 rounded-xl text-on-surface text-sm" 
            required
            autocomplete="current-password"
            minlength="6"
          >
          <button 
            id="togglePassword" 
            type="button" 
            class="toggle-password"
            aria-label="Toggle password visibility"
          >
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
        <div id="passwordError" class="error-message" style="display: none;"></div>
        <div id="passwordSuccess" class="success-message" style="display: none;"></div>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center gap-2 pt-1">
        <input 
          id="remember" 
          name="remember" 
          type="checkbox" 
          class="checkbox-custom"
          checked
        >
        <label for="remember" class="text-xs text-on-surface cursor-pointer select-none">Remember me</label>
      </div>

      <!-- Login Button -->
      <button 
        id="loginBtn"
        type="submit" 
        class="login-btn w-full h-12 bg-secondary text-on-primary rounded-xl font-semibold text-sm mt-6 shadow-lg flex items-center justify-center gap-2 transition-all"
      >
        <span id="btnText">Login</span>
        <span id="loadingSpinner" class="loading-spinner" style="display: none;"></span>
      </button>

      <!-- General Error/Success -->
      <div id="formMessage" class="mt-4 p-3 rounded-lg text-sm hidden" style="animation: slideDown 0.3s ease;"></div>
    </form>

    <!-- Signup Link -->
    <div class="mt-6 text-center text-xs text-on-surface-variant">
      Don't have an account? <a href="register.html" class="text-secondary font-semibold hover:underline transition-colors">Signup</a>
    </div>
  </div>
</main>

<script>
  // Form Elements
  const loginForm = document.getElementById('loginForm');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const rememberCheckbox = document.getElementById('remember');
  const togglePasswordBtn = document.getElementById('togglePassword');
  const loginBtn = document.getElementById('loginBtn');

  // Messages Elements
  const usernameError = document.getElementById('usernameError');
  const usernameSuccess = document.getElementById('usernameSuccess');
  const passwordError = document.getElementById('passwordError');
  const passwordSuccess = document.getElementById('passwordSuccess');
  const formMessage = document.getElementById('formMessage');
  const btnText = document.getElementById('btnText');
  const loadingSpinner = document.getElementById('loadingSpinner');

  // Password visibility toggle
  togglePasswordBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    
    const icon = togglePasswordBtn.querySelector('.material-symbols-outlined');
    icon.textContent = isPassword ? 'visibility_off' : 'visibility';
  });

  // Real-time validation - Username
  usernameInput.addEventListener('input', () => {
    const value = usernameInput.value.trim();
    usernameError.style.display = 'none';
    usernameSuccess.style.display = 'none';

    if (value.length > 0 && value.length < 3) {
      usernameError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Minimal 3 karakter';
      usernameError.style.display = 'flex';
    } else if (value.length >= 3) {
      usernameSuccess.innerHTML = '<span class="material-symbols-outlined text-sm">check_circle</span> Username valid';
      usernameSuccess.style.display = 'flex';
    }
  });

  usernameInput.addEventListener('blur', () => {
    if (usernameInput.value.trim() === '') {
      usernameError.style.display = 'none';
      usernameSuccess.style.display = 'none';
    }
  });

  // Real-time validation - Password
  passwordInput.addEventListener('input', () => {
    const value = passwordInput.value;
    passwordError.style.display = 'none';
    passwordSuccess.style.display = 'none';

    if (value.length > 0 && value.length < 6) {
      passwordError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Minimal 6 karakter';
      passwordError.style.display = 'flex';
    } else if (value.length >= 6) {
      passwordSuccess.innerHTML = '<span class="material-symbols-outlined text-sm">check_circle</span> Password kuat';
      passwordSuccess.style.display = 'flex';
    }
  });

  passwordInput.addEventListener('blur', () => {
    if (passwordInput.value === '') {
      passwordError.style.display = 'none';
      passwordSuccess.style.display = 'none';
    }
  });

  // Clear message function
  function clearFormMessage() {
    formMessage.classList.add('hidden');
    formMessage.textContent = '';
  }

  // Show message function
  function showFormMessage(message, type = 'error') {
    formMessage.textContent = message;
    formMessage.className = `mt-4 p-3 rounded-lg text-sm ${
      type === 'error' 
        ? 'bg-red-50 text-red-700 border border-red-200' 
        : 'bg-green-50 text-green-700 border border-green-200'
    }`;
    formMessage.style.animation = 'slideDown 0.3s ease';
  }

  // Form submission
  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearFormMessage();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const remember = rememberCheckbox.checked;

    // Validation
    if (!username || !password) {
      showFormMessage('Mohon isi semua field', 'error');
      return;
    }

    if (username.length < 3) {
      usernameError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Username minimal 3 karakter';
      usernameError.style.display = 'flex';
      return;
    }

    if (password.length < 6) {
      passwordError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Password minimal 6 karakter';
      passwordError.style.display = 'flex';
      return;
    }

    // Show loading state
    loginBtn.disabled = true;
    btnText.style.display = 'none';
    loadingSpinner.style.display = 'inline-block';

    try {
      // Simulate API call
      await new Promise(resolve => setTimeout(resolve, 1500));

      // Check stored user data (from registration)
      const storedUser = localStorage.getItem('user');
      
      if (storedUser) {
        const user = JSON.parse(storedUser);
        
        // Simple authentication check (in real app, verify with backend)
        if (user.username === username && user.password === password) {
          // Store login state
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('currentUser', JSON.stringify({
            username: user.username,
            email: user.email,
            remember: remember
          }));

          showFormMessage('Login berhasil! Redirecting...', 'success');
          
          // Redirect after short delay
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
          return;
        } else {
          showFormMessage('Username atau password salah', 'error');
        }
      } else {
        showFormMessage('Akun tidak ditemukan. Silakan daftar terlebih dahulu.', 'error');
      }
    } catch (error) {
      showFormMessage('Terjadi kesalahan. Coba lagi.', 'error');
      console.error('Login error:', error);
    } finally {
      // Reset loading state
      loginBtn.disabled = false;
      btnText.style.display = 'inline';
      loadingSpinner.style.display = 'none';
    }
  });

  // Auto-fill if remember me was checked
  window.addEventListener('load', () => {
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser) {
      try {
        const user = JSON.parse(currentUser);
        usernameInput.value = user.username;
        rememberCheckbox.checked = user.remember;
      } catch (e) {
        console.error('Error parsing currentUser:', e);
      }
    }
  });
</script>
</body>
</html>
