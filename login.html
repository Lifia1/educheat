<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-accent min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8">
    <h1 class="text-4xl font-bold text-center text-primary mb-2">EduCheat</h1>
    <p class="text-center text-gray-600 mb-8">Welcome Back</p>

    <div class="space-y-6">
      <div>
        <label class="block text-sm font-medium mb-2">Email</label>
        <input id="email" type="email" value="lfianasywa@gmail.com" 
               class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-secondary">
      </div>
      <div>
        <label class="block text-sm font-medium mb-2">Password</label>
        <input id="password" type="password" value="123456" 
               class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-secondary">
      </div>
      <button onclick="login()" 
              class="w-full bg-primary text-white py-4 rounded-2xl font-semibold text-lg">
        Masuk
      </button>
    </div>

    <p class="text-center mt-8 text-sm">
      Belum punya akun? <a href="register.html" class="text-secondary font-medium">Daftar</a>
    </p>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Dummy user
      if (email && password) {
        const user = { 
          name: "Lifia A", 
          email: email,
          avatar: "https://picsum.photos/id/1011/150/150"
        };
        localStorage.setItem('currentUser', JSON.stringify(user));
        window.location.href = 'index.html';
      } else {
        alert("Email dan password tidak boleh kosong!");
      }
    }
  </script>
</body>
</html>
