<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#1A2E25', secondary: '#437C6F' } } } }
  </script>
</head>
<body class="bg-accent min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8">
    <h1 class="text-4xl font-bold text-center text-primary">EduCheat</h1>
    <p class="text-center text-gray-600 mt-2">Masuk ke akun kamu</p>

    <div class="mt-8 space-y-6">
      <input id="email" type="email" value="lfianasywa@gmail.com" class="w-full px-5 py-4 border rounded-2xl">
      <input id="password" type="password" value="123456" class="w-full px-5 py-4 border rounded-2xl">

      <button onclick="login()" 
              class="w-full bg-primary text-white py-4 rounded-2xl font-semibold text-lg">
        Masuk
      </button>
    </div>

    <p class="text-center mt-6">Belum punya akun? 
      <a href="register.html" class="text-secondary font-medium">Daftar</a>
    </p>
  </div>

  <script>
    function login() {
      localStorage.setItem('user', JSON.stringify({name: "Lifia A"}));
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
