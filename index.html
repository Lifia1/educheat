<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(145deg, #1A2E25, #437C6F); }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-1 { animation: fadeInUp 0.7s ease forwards; }
    .fade-2 { animation: fadeInUp 0.7s ease 0.3s forwards; opacity: 0; }
    .fade-3 { animation: fadeInUp 0.7s ease 0.6s forwards; opacity: 0; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white">
  <div class="text-center flex flex-col items-center">

    <!-- Logo SVG inline -->
    <div class="fade-1 mb-6">
      <svg width="160" height="160" viewBox="0 0 556 556" xmlns="http://www.w3.org/2000/svg"
           style="filter: drop-shadow(0 0 20px rgba(255,255,255,0.15));">
        <rect x="30" y="30" width="496" height="496" fill="none" stroke="white" stroke-width="22"/>
        <rect x="176" y="92" width="210" height="290" fill="none" stroke="white" stroke-width="18"/>
        <text x="278" y="310" text-anchor="middle"
              font-family="Arial Black, sans-serif" font-weight="900"
              font-size="200" fill="white" letter-spacing="-4">E</text>
        <text x="278" y="480" text-anchor="middle"
              font-family="Arial Black, sans-serif" font-weight="900"
              font-size="58" fill="white" letter-spacing="14">EDUCHEAT</text>
      </svg>
    </div>

    <!-- Tagline -->
    <div class="fade-2 mb-20">
      <p class="text-lg opacity-85 tracking-wide">Belajar Kapan Saja, Di Mana Saja</p>
    </div>

    <!-- Loading spinner -->
    <div class="fade-3 flex flex-col items-center gap-3">
      <div class="w-9 h-9 border-[3px] border-white/25 border-t-white rounded-full animate-spin"></div>
      <p class="text-sm opacity-50 tracking-wider">Memuat...</p>
    </div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2200);
  </script>
</body>
</html>
