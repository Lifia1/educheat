<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCheat - Home</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      content: ["./**/*.{html,js}"],
      theme: {
        extend: {
          colors: {
            primary: '#1A2E25',
            secondary: '#437C6F',
            accent: '#F5F5F0',
            "surface": "#fcf9f8",
            "on-surface": "#1b1c1c",
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fcf9f8;
    }
    .headline {
      font-family: 'Playfair Display', serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Top AppBar -->
  <header class="flex justify-between items-center w-full px-4 h-16 bg-white border-b border-gray-200 fixed top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-secondary overflow-hidden">
        <img src="https://picsum.photos/id/64/200/200" alt="Profile" class="w-full h-full object-cover">
      </div>
      <span class="font-bold text-2xl text-primary headline">EduCheat</span>
    </div>
    <button class="material-symbols-outlined text-2xl text-primary">notifications</button>
  </header>

  <main class="mt-16 px-4 pt-6 space-y-8">

    <!-- Greeting & Streak -->
    <section>
      <div class="flex justify-between items-end">
        <div>
          <p class="text-sm text-gray-500">Selamat datang,</p>
          <h1 id="userName" class="text-3xl font-semibold text-primary headline">Lifia A</h1>
        </div>
        <div class="flex items-center bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full gap-1">
          <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
          <span class="font-medium">5 Hari</span>
        </div>
      </div>
    </section>

    <!-- Continue Learning -->
    <section>
      <h2 class="text-lg font-semibold mb-3">Lanjutkan Belajar</h2>
      <div onclick="location.href='course-detail.html'" class="bg-white border border-gray-200 p-5 rounded-2xl shadow-sm hover:shadow-md transition-all cursor-pointer">
        <div class="flex gap-4">
          <div class="w-20 h-20 bg-gradient-to-br from-primary to-secondary rounded-2xl flex items-center justify-center text-4xl text-white flex-shrink-0">
            🎨
          </div>
          <div class="flex-1">
            <h3 class="font-semibold text-lg">UI/UX Fundamentals</h3>
            <p class="text-sm text-gray-500">Modul 3 dari 10</p>
            <div class="w-full bg-gray-200 h-2 rounded-full mt-4">
              <div class="bg-secondary h-2 rounded-full w-[35%]"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Categories -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold">Kategori</h2>
        <button class="text-secondary text-sm font-medium">Lihat Semua</button>
      </div>
      <div class="flex gap-3 overflow-x-auto custom-scrollbar pb-2">
        <button class="flex items-center gap-2 bg-primary text-white px-6 py-3 rounded-2xl whitespace-nowrap">
          <span class="material-symbols-outlined">grid_view</span>
          <span class="font-medium">UI/UX</span>
        </button>
        <button class="flex items-center gap-2 bg-white border border-gray-300 px-6 py-3 rounded-2xl whitespace-nowrap hover:bg-gray-50">
          <span class="material-symbols-outlined">code</span>
          <span class="font-medium">Web Dev</span>
        </button>
        <button class="flex items-center gap-2 bg-white border border-gray-300 px-6 py-3 rounded-2xl whitespace-nowrap hover:bg-gray-50">
          <span class="material-symbols-outlined">analytics</span>
          <span class="font-medium">Data</span>
        </button>
      </div>
    </section>

    <!-- Rekomendasi -->
    <section>
      <h2 class="text-lg font-semibold mb-4">Rekomendasi Untukmu</h2>
      <div class="flex gap-4 overflow-x-auto custom-scrollbar pb-4" id="recommendations">
        <!-- Diisi via JavaScript -->
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 w-full h-16 z-50 bg-white border-t border-gray-200 flex justify-around items-center px-4 pb-4 rounded-t-xl shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
    <a href="index.html" class="flex flex-col items-center justify-center text-primary font-bold transition-all">
      <span class="material-symbols-outlined">home</span>
      <span class="text-xs">Home</span>
    </a>
    <a href="courses.html" class="flex flex-col items-center justify-center text-gray-500 transition-all hover:text-secondary">
      <span class="material-symbols-outlined">school</span>
      <span class="text-xs">Courses</span>
    </a>
    <a href="notes.html" class="flex flex-col items-center justify-center text-gray-500 transition-all hover:text-secondary">
      <span class="material-symbols-outlined">note</span>
      <span class="text-xs">Catatan</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center justify-center text-gray-500 transition-all hover:text-secondary">
      <span class="material-symbols-outlined">person</span>
      <span class="text-xs">Profil</span>
    </a>
  </nav>

  <script>
    // User Name
    const user = JSON.parse(localStorage.getItem('user')) || { name: "Lifia A" };
    document.getElementById('userName').textContent = user.name;

    // Recommendations
    const recs = [
      {
        title: "Figma Dasar",
        modules: "10 Modul",
        price: "Gratis",
        img: "https://picsum.photos/id/1015/600/300"
      },
      {
        title: "HTML & CSS Mastery",
        modules: "20 Modul",
        price: "Rp 79.000",
        img: "https://picsum.photos/id/201/600/300"
      },
      {
        title: "Data Science 101",
        modules: "15 Modul",
        price: "Rp 129.000",
        img: "https://picsum.photos/id/237/600/300"
      }
    ];

    const container = document.getElementById('recommendations');
    container.innerHTML = recs.map(r => `
      <div onclick="location.href='course-detail.html'" class="min-w-[240px] bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all cursor-pointer">
        <img src="${r.img}" class="w-full h-36 object-cover">
        <div class="p-4">
          <h4 class="font-semibold text-base">${r.title}</h4>
          <p class="text-sm text-gray-500">${r.modules}</p>
          <div class="flex justify-between items-center mt-3">
            <span class="font-medium text-secondary">${r.price}</span>
            <span class="material-symbols-outlined text-primary">chevron_right</span>
          </div>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
