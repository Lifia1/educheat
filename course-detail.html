<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Dasar - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#1A2E25', secondary: '#437C6F', accent: '#F5F5F0' } } } }
  </script>
</head>
<body class="bg-accent pb-20">

  <header class="bg-white sticky top-0 z-50 shadow-sm">
    <div class="px-4 py-4 flex justify-between items-center">
      <i onclick="history.back()" class="fa-solid fa-arrow-left text-2xl cursor-pointer"></i>
      <h1 class="font-semibold text-lg">Figma Dasar</h1>
      <i class="fa-solid fa-share text-xl"></i>
    </div>
  </header>

  <main class="max-w-screen-xl mx-auto px-4">
    <div class="h-64 bg-gradient-to-br from-primary to-secondary rounded-3xl flex items-center justify-center text-8xl mb-6">🎨</div>
    
    <h2 class="text-2xl font-bold headline">UI/UX Fundamentals untuk Pemula</h2>
    <div class="flex gap-4 text-sm mt-3 text-gray-600">
      <span>⭐ 4.5</span>
      <span>10 Modul</span>
      <span>5 Jam</span>
    </div>

    <div class="bg-white rounded-3xl p-5 mt-6">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-gray-300 rounded-full"></div>
        <div>
          <p class="font-medium">Komida Yanuar</p>
          <p class="text-sm text-gray-500">UI/UX Designer</p>
        </div>
      </div>
    </div>

    <div class="mt-8">
      <h3 class="font-semibold mb-3">Daftar Modul (3/10 Selesai)</h3>
      <div class="space-y-3">
        <div class="bg-white p-4 rounded-2xl flex items-center gap-3">
          <div class="w-8 h-8 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-lg">✓</div>
          <div class="flex-1">1. Pengenalan UI/UX</div>
          <span class="text-sm text-gray-500">10 mnt</span>
        </div>
      </div>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t">
    <button class="w-full bg-primary text-white py-4 rounded-2xl font-semibold text-lg">
      Mulai Gratis
    </button>
  </div>
</body>
</html>
