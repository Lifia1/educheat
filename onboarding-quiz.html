<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding Quiz - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-accent min-h-screen pb-20">
  <div class="max-w-md mx-auto px-6 pt-8">
    <div class="flex justify-between text-sm mb-6">
      <span>Pertanyaan 2 dari 5</span>
    </div>
    
    <h2 class="text-2xl font-semibold mb-8">Apa tujuan karir kamu?</h2>

    <div class="space-y-3">
      <div onclick="this.classList.toggle('bg-primary text-white')" 
           class="bg-white p-5 rounded-2xl border-2 border-transparent hover:border-primary cursor-pointer">
        UI/UX Designer
      </div>
      <div class="bg-white p-5 rounded-2xl">Web Developer</div>
      <div class="bg-white p-5 rounded-2xl">Data Analyst</div>
      <div class="bg-white p-5 rounded-2xl">Mobile Developer</div>
    </div>

    <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto px-6 flex gap-4">
      <button onclick="history.back()" 
              class="flex-1 py-4 border border-gray-300 rounded-2xl font-medium">Kembali</button>
      <button onclick="location.href='onboarding-result.html'" 
              class="flex-1 bg-primary text-white py-4 rounded-2xl font-semibold">Selanjutnya</button>
    </div>
  </div>
</body>
</html>
