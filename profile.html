<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-accent min-h-screen pb-20">
  <header class="bg-white p-4">
    <h1 class="text-2xl font-bold text-primary text-center">Profil</h1>
  </header>

  <main class="max-w-screen-xl mx-auto px-4 pt-6 text-center">
    <div class="w-28 h-28 mx-auto bg-gray-300 rounded-3xl"></div>
    <h2 class="text-2xl font-bold mt-4">Lifia A</h2>
    <p class="text-gray-500">lifia.alicia@university.ac.id</p>

    <div class="mt-8 bg-white rounded-3xl p-6">
      <h3 class="font-semibold mb-4">Progress Kursus</h3>
      <div class="space-y-6">
        <div>
          <p class="text-sm">UI/UX Fundamentals <span class="float-right text-primary">30%</span></p>
          <div class="h-2 bg-gray-200 rounded-full mt-2"><div class="h-2 bg-primary rounded-full w-1/3"></div></div>
        </div>
      </div>
    </div>

    <button class="mt-8 w-full bg-primary text-white py-4 rounded-2xl font-semibold">
      Edit Profil
    </button>
    <!-- Di bagian bawah profile -->
<div class="mt-8 px-4">
  <button onclick="logout()" 
          class="w-full bg-red-500 text-white py-4 rounded-2xl font-semibold">
    Keluar Sesi
  </button>
</div>

<script>
  function logout() {
    if (confirm("Yakin ingin keluar?")) {
      localStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    }
  }
</script>
  </main>
</body>
</html>
