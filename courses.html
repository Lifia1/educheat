<body class="bg-background text-on-background font-body-md min-h-screen pb-4xl">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-3xl bg-surface z-50 fixed top-0 left-0 border-b border-outline-variant">
  <h1 class="font-headline-h6 text-headline-h6-mobile text-on-surface">Semua Kursus</h1>
  <div class="flex items-center gap-md">
    <button class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors p-sm rounded-full">notifications</button>
    <div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
      <img alt="Profile" class="w-full h-full object-cover" src="https://i.pinimg.com/736x/a0/c0/d9/a0c0d934c162b1594fcf1e46d9e3c305.jpg" />
    </div>
  </div>
</header>
<!-- Main Content -->
<main class="pt-3xl px-margin-mobile max-w-screen-md mx-auto">
<!-- Search Bar Section -->
<section class="mt-lg">
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="search">search</span>
<input id="courseSearch" class="w-full h-12 pl-xl pr-md bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none font-body-md" placeholder="Cari materi atau kursus..." type="text"/>
</div>
</section>
<!-- Filter Chips (Horizontal Scroll) -->
<section class="mt-lg overflow-x-auto no-scrollbar -mx-margin-mobile px-margin-mobile">
<div class="flex gap-sm whitespace-nowrap">
<button type="button" data-category="Semua" class="filter-chip px-md py-xs bg-primary-container text-on-primary rounded-full font-label-md transition-all active:scale-95">Semua</button>
<button type="button" data-category="Design" class="filter-chip px-md py-xs bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-md hover:bg-surface-container-high transition-all active:scale-95">UI/UX</button>
<button type="button" data-category="Mastery" class="filter-chip px-md py-xs bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-md hover:bg-surface-container-high transition-all active:scale-95">Mastery</button>
<button type="button" data-category="Web Dev" class="filter-chip px-md py-xs bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-md hover:bg-surface-container-high transition-all active:scale-95">Web Dev</button>
<button type="button" data-category="Data" class="filter-chip px-md py-xs bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-md hover:bg-surface-container-high transition-all active:scale-95">Data</button>
<button type="button" data-category="Mobile" class="filter-chip px-md py-xs bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-md hover:bg-surface-container-high transition-all active:scale-95">Mobile</button>
</div>
</section>
<!-- Course List (Vertical) -->
<section id="courseList" class="mt-xl flex flex-col gap-lg pb-lg"></section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-4xl z-50 bg-surface flex justify-around items-center px-md pb-safe rounded-t-xl shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:text-secondary" href="index.html">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold transition-all scale-95" href="courses.html">
<span class="material-symbols-outlined" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-sm text-label-sm">Courses</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:text-secondary" href="search.html">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label-sm text-label-sm">Search</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:text-secondary" href="profile.html">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>

<script>
        const courses = [
            {
                title: 'UI/UX Dasar: Prinsip & Teori',
                category: 'Design',
                author: 'Khanza Azka',
                price: 'Rp 149.000',
                rating: '4.8',
                image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuBisHEXdgjRLQ1dEbZ97P_pu1yZ2qFEr85Cm8D7HyAp9STA5mz-j5Tq3VJ1jeKZiMfS4l_fsZRrwB-nuiSw4zIQ0MMnP-7gk-zK4nS_1dW50ydyINjbxFQOYhBSeh7aAMc9eZY0_uT1bFEgODpKkgXIqJ_1f108-Ldz6hVd22vijLX4VrjI-PB0VXy-ZROuzxXLk6_84a1tgfbG2om2hTyUKW0tJei9jhJEeT8fd_uZtmzDqLGMmaqxpxYHcOR7FPQL9x95RF2HOFo',
                url: 'course-detail.html'
            },
            {
                title: 'Figma Pro: Advanced Component',
                category: 'Mastery',
                author: 'Faiz Herendra',
                price: 'Gratis',
                rating: '4.9',
                image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuArF5I6tUlTk2UmGzHEtQQZfiDsWJCOPR3X6XGL5QdQle0RKYbIeUkdHDIVKR9ooXqIbGt5DWTWG7r9BG0E4NPAZ_2qSiPM83VCzLZgGFOo4lSHH0ygJ521sO8vppIpjb69svX0KYgnQqbjGaDgnp_sgKl11vRCFqDjEfPmLeQLZSon_cxiBOKDz1Q2DLRX_8hWpj6vd6pZKBIDrKMPL_AoakU4OdnXbiGpO02EX1FeuvCKloi8ZCUHN9fOYhypVoOBn34jJqpW9jw',
                url: 'course-detail.html'
            },
            {
                title: 'HTML & CSS Modern Layout',
                category: 'Web Dev',
                author: 'Avila Nasya',
                price: 'Rp 99.000',
                rating: '4.7',
                image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuDzdglkLFiYb-OmYA7mdjh6zFPyLT83HqXIE4oDLumWDzvx0BP_EkKc_eQN4c7hfFVJ_tnxPcT27rvzqJZGQFMgG5WVNw8XC2pLE16PUPpZGp1xdmcdK6BkkM6riiA_A3hetoG_PknryeBIEj6RlqNDm8t8GeIDFUc76t7e8f7XK5vbVynLdj1LbGqb0dwod0j3FFL3QUcxtEpW9RCexpwQIKd_hj4axz6qsBzqNwKllKzH2bhmoUnlsg9weqf79EcgWmXWM0fk86k',
                url: 'course-detail.html'
            }
        ];

        const courseList = document.getElementById('courseList');
        const searchInput = document.getElementById('courseSearch');
        const filterButtons = document.querySelectorAll('.filter-chip');
        let activeCategory = 'Semua';

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100', 'translate-y-0');
                    entry.target.classList.remove('opacity-0', 'translate-y-4');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });

        function renderCourses(coursesToRender) {
            if (!coursesToRender.length) {
                courseList.innerHTML = `
                    <div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md text-center text-on-surface-variant">
                        Tidak ada kursus yang cocok dengan kata kunci atau kategori saat ini.
                    </div>`;
                return;
            }

            courseList.innerHTML = coursesToRender.map(course => `
                <div onclick="location.href='${course.url}'" class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant group cursor-pointer hover:shadow-lg transition-shadow transform opacity-0 translate-y-4">
                    <div class="aspect-video w-full relative">
                        <img class="w-full h-full object-cover" src="${course.image}" alt="${course.title}" loading="lazy"/>
                        <div class="absolute top-sm right-sm bg-white/90 backdrop-blur-sm px-sm py-[2px] rounded-lg flex items-center gap-xs">
                            <span class="material-symbols-outlined text-yellow-500 text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
                            <span class="font-label-sm text-on-surface">${course.rating}</span>
                        </div>
                    </div>
                    <div class="p-md">
                        <span class="font-label-sm text-secondary uppercase tracking-wider">${course.category}</span>
                        <h3 class="font-headline-h6 text-headline-h6 mt-xs text-on-surface group-hover:text-secondary transition-colors">${course.title}</h3>
                        <p class="font-body-sm text-on-surface-variant mt-xs">Oleh ${course.author}</p>
                        <div class="mt-md flex justify-between items-center">
                            <span class="font-headline-h6 ${course.price === 'Gratis' ? 'text-secondary' : 'text-primary'}">${course.price}</span>
                            <span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
                        </div>
                    </div>
                </div>`).join('');

            document.querySelectorAll('#courseList > div').forEach(card => observer.observe(card));
        }

        function updateFilterButtonStyles(selectedCategory) {
            filterButtons.forEach(button => {
                const isActive = button.dataset.category === selectedCategory;
                button.classList.toggle('bg-primary-container', isActive);
                button.classList.toggle('text-on-primary', isActive);
                button.classList.toggle('bg-surface-container', !isActive);
                button.classList.toggle('text-on-surface-variant', !isActive);
                button.classList.toggle('border-outline-variant', !isActive);
            });
        }

        function getFilteredCourses() {
            const query = searchInput.value.trim().toLowerCase();
            return courses.filter(course => {
                const matchesCategory = activeCategory === 'Semua' || course.category.toLowerCase() === activeCategory.toLowerCase();
                const matchesSearch = course.title.toLowerCase().includes(query) || course.author.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
        }

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                activeCategory = button.dataset.category;
                updateFilterButtonStyles(activeCategory);
                renderCourses(getFilteredCourses());
            });
        });

        searchInput.addEventListener('input', () => renderCourses(getFilteredCourses()));

        updateFilterButtonStyles(activeCategory);
        renderCourses(courses);
    </script>
</body>
</html>
