<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#1A2E25', secondary: '#437C6F', accent: '#F5F5F0' } } } }
  </script>
</head>
<body class="bg-accent min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8">
    <h1 class="text-3xl font-bold text-center text-primary">Buat Akun Baru</h1>
    <p class="text-center text-gray-600 mt-2">Bergabung dengan EduCheat</p>

    <div class="mt-8 space-y-6">
      <input id="name" type="text" placeholder="Nama Lengkap" class="w-full px-5 py-4 border rounded-2xl">
      <input id="email" type="email" placeholder="Email" class="w-full px-5 py-4 border rounded-2xl">
      <input id="password" type="password" placeholder="Password" class="w-full px-5 py-4 border rounded-2xl">

      <button onclick="register()" 
              class="w-full bg-primary text-white py-4 rounded-2xl font-semibold text-lg">
        Daftar Sekarang
      </button>
    </div>

    <p class="text-center mt-6">Sudah punya akun? 
      <a href="login.html" class="text-secondary font-medium">Login</a>
    </p>
  </div>

  <script>
    function register() {
      const name = document.getElementById('name').value;
      if (name) {
        localStorage.setItem('user', JSON.stringify({name}));
        alert("Registrasi Berhasil!");
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
