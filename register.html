<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-accent min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8">
    <h1 class="text-3xl font-bold text-center text-primary mb-1">Buat Akun Baru</h1>
    <p class="text-center text-gray-600 mb-8">Bergabung dengan EduCheat sekarang</p>

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
        <input id="name" type="text" value="Lifia A" class="w-full px-5 py-4 border border-gray-300 rounded-2xl">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input id="email" type="email" value="lfianasywa@gmail.com" class="w-full px-5 py-4 border border-gray-300 rounded-2xl">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input id="password" type="password" value="123456" class="w-full px-5 py-4 border border-gray-300 rounded-2xl">
      </div>
      <button onclick="register()" class="w-full bg-primary text-white py-4 rounded-2xl font-semibold text-lg">
        Daftar Sekarang
      </button>
    </div>

    <p class="text-center mt-6 text-sm text-gray-600">
      Sudah punya akun? <a href="login.html" class="text-secondary font-medium">Login</a>
    </p>
  </div>

  <script>
    function register() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (name && email && password) {
        const user = { name, email, avatar: "https://picsum.photos/id/1011/150/150" };
        localStorage.setItem('currentUser', JSON.stringify(user));
        alert("Registrasi berhasil!");
        window.location.href = 'index.html';
      } else {
        alert("Mohon isi semua field!");
      }
    }
  </script>
</body>
</html>
