<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EduCheat - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              secondary: "#2e685c",
              primary: "#051911",
              background: "#fcf9f8",
              surface: "#fcf9f8",
              "surface-container-low": "#f6f3f2",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#b0ecdc",
              "outline-variant": "#c2c8c3",
              "on-surface": "#1b1c1c",
              "on-surface-variant": "#424844",
              "primary-container": "#1a2e25",
              "on-primary": "#ffffff"
            },
            fontFamily: {
              headline: ["Playfair Display"],
              body: ["Inter"]
            },
            fontSize: {
              label: ["14px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
          background-image: url('https://i.pinimg.com/736x/05/6c/d9/056cd9b77ec945232d2f4d16dda9a74f.jpg');
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
          min-height: 100vh;
        }
        
        body::before {
          content: '';
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(5, 25, 17, 0.35);
          z-index: -1;
          pointer-events: none;
        }
        
        .glass-card {
          background: rgba(245, 245, 245, 0.9);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.3);
          box-shadow: 0 8px 32px rgba(5, 25, 17, 0.15);
        }
        
        .input-field {
          background: rgba(255, 255, 255, 0.7);
          border: 1.5px solid rgba(46, 104, 92, 0.2);
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          padding-left: 2.75rem;
        }
        
        .input-field::placeholder {
          color: #a8aca8;
        }
        
        .input-field:focus {
          background: rgba(255, 255, 255, 0.95);
          border-color: #2e685c;
          box-shadow: 0 0 0 3px rgba(46, 104, 92, 0.12);
          outline: none;
        }
        
        .error-message {
          color: #ba1a1a;
          font-size: 13px;
          margin-top: 6px;
          display: flex;
          align-items: center;
          gap: 6px;
          animation: slideDown 0.3s ease;
        }
        
        .success-message {
          color: #2e685c;
          font-size: 13px;
          margin-top: 6px;
          display: flex;
          align-items: center;
          gap: 6px;
          animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
          from {
            opacity: 0;
            transform: translateY(-8px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        
        .register-btn {
          background: linear-gradient(135deg, #2e685c 0%, #1a5844 100%);
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          font-weight: 600;
        }
        
        .register-btn:hover:not(:disabled) {
          transform: translateY(-2px);
          box-shadow: 0 12px 32px rgba(46, 104, 92, 0.35);
        }
        
        .loading-spinner {
          display: inline-block;
          width: 16px;
          height: 16px;
          border: 2px solid rgba(255, 255, 255, 0.3);
          border-top-color: white;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        
        .fade-in {
          animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      </style>
  </head>
<body class="font-body text-body overflow-x-hidden flex items-center justify-center min-h-screen px-4 py-6">
<main class="w-full max-w-md">
  <div class="glass-card rounded-3xl p-8 shadow-2xl fade-in">
    <div class="text-left mb-8">
      <h1 class="font-headline text-3xl text-primary mb-1 leading-tight">Sign Up</h1>
      <p class="text-sm text-on-surface-variant">Join EduCheat and start learning today</p>
    </div>

    <form id="registerForm" class="space-y-4" novalidate>
      <div>
        <div class="relative">
          <span class="material-symbols-outlined input-icon">account_circle</span>
          <input id="fullName" name="fullName" type="text" placeholder="Full Name" class="input-field w-full h-12 rounded-xl text-on-surface text-sm" required autocomplete="name" minlength="3">
        </div>
        <div id="nameError" class="error-message" style="display: none;"></div>
        <div id="nameSuccess" class="success-message" style="display: none;"></div>
      </div>

      <div>
        <div class="relative">
          <span class="material-symbols-outlined input-icon">email</span>
          <input id="email" name="email" type="email" placeholder="Email Address" class="input-field w-full h-12 rounded-xl text-on-surface text-sm" required autocomplete="email">
        </div>
        <div id="emailError" class="error-message" style="display: none;"></div>
        <div id="emailSuccess" class="success-message" style="display: none;"></div>
      </div>

      <div>
        <div class="relative">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input id="password" name="password" type="password" placeholder="Password" class="input-field w-full h-12 pr-12 rounded-xl text-on-surface text-sm" required autocomplete="new-password" minlength="6">
          <button id="togglePassword" type="button" class="toggle-password" aria-label="Toggle password visibility">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
        <div id="passwordError" class="error-message" style="display: none;"></div>
        <div id="passwordSuccess" class="success-message" style="display: none;"></div>
      </div>

      <div>
        <div class="relative">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" class="input-field w-full h-12 pr-12 rounded-xl text-on-surface text-sm" required autocomplete="new-password" minlength="6">
          <button id="toggleConfirmPassword" type="button" class="toggle-password" aria-label="Toggle confirm password visibility">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
        <div id="confirmError" class="error-message" style="display: none;"></div>
        <div id="confirmSuccess" class="success-message" style="display: none;"></div>
      </div>

      <button id="registerBtn" type="submit" class="register-btn w-full h-12 bg-secondary text-on-primary rounded-xl font-semibold text-sm mt-6 shadow-lg flex items-center justify-center gap-2 transition-all">
        <span id="btnText">Sign Up</span>
        <span id="loadingSpinner" class="loading-spinner" style="display: none;"></span>
      </button>

      <div id="formMessage" class="mt-4 p-3 rounded-lg text-sm hidden" style="animation: slideDown 0.3s ease;"></div>
    </form>

    <div class="mt-6 text-center text-xs text-on-surface-variant">
      Already have an account? <a href="login.html" class="text-secondary font-semibold hover:underline transition-colors">Login</a>
    </div>
  </div>
</main>
<script>
  const registerForm = document.getElementById('registerForm');
  const fullNameInput = document.getElementById('fullName');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const registerBtn = document.getElementById('registerBtn');

  const nameError = document.getElementById('nameError');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const confirmError = document.getElementById('confirmError');
  const formMessage = document.getElementById('formMessage');
  const btnText = document.getElementById('btnText');
  const loadingSpinner = document.getElementById('loadingSpinner');

  function showFormMessage(message, type = 'error') {
    formMessage.textContent = message;
    formMessage.className = `mt-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
  }

  registerForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    formMessage.classList.add('hidden');

    const fullName = fullNameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!fullName || !email || !password || !confirmPassword) {
      showFormMessage('Mohon isi semua field', 'error');
      return;
    }

    if (fullName.length < 3) {
      nameError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Nama minimal 3 karakter';
      nameError.style.display = 'flex';
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      emailError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Email tidak valid';
      emailError.style.display = 'flex';
      return;
    }

    if (password.length < 6) {
      passwordError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Password minimal 6 karakter';
      passwordError.style.display = 'flex';
      return;
    }

    if (password !== confirmPassword) {
      confirmError.innerHTML = '<span class="material-symbols-outlined text-sm">error</span> Password tidak cocok';
      confirmError.style.display = 'flex';
      return;
    }

    registerBtn.disabled = true;
    btnText.style.display = 'none';
    loadingSpinner.style.display = 'inline-block';

    try {
      await new Promise(resolve => setTimeout(resolve, 1500));

      const existingUser = localStorage.getItem('user');
      if (existingUser) {
        const user = JSON.parse(existingUser);
        if (user.email === email) {
          showFormMessage('Email sudah terdaftar', 'error');
          registerBtn.disabled = false;
          btnText.style.display = 'inline';
          loadingSpinner.style.display = 'none';
          return;
        }
      }

      const userData = {
        username: fullName.split(' ')[0].toLowerCase(),
        fullName: fullName,
        email: email,
        password: password
      };

      localStorage.setItem('user', JSON.stringify(userData));
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('currentUser', JSON.stringify({
        username: userData.username,
        email: userData.email,
        remember: true
      }));

      showFormMessage('Registrasi berhasil! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);
    } catch (error) {
      showFormMessage('Terjadi kesalahan. Coba lagi.', 'error');
      registerBtn.disabled = false;
      btnText.style.display = 'inline';
      loadingSpinner.style.display = 'none';
    }
  });

  document.getElementById('togglePassword').addEventListener('click', (e) => {
    e.preventDefault();
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    e.currentTarget.querySelector('.material-symbols-outlined').textContent = isPassword ? 'visibility_off' : 'visibility';
  });

  document.getElementById('toggleConfirmPassword').addEventListener('click', (e) => {
    e.preventDefault();
    const isPassword = confirmPasswordInput.type === 'password';
    confirmPasswordInput.type = isPassword ? 'text' : 'password';
    e.currentTarget.querySelector('.material-symbols-outlined').textContent = isPassword ? 'visibility_off' : 'visibility';
  });
</script>
</body>
</html>
