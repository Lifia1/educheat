<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle parallax effect on mouse move for the illustration
            const main = document.querySelector('main');
            const illustration = document.querySelector('.animate-float');
            
            main.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                if (illustration) {
                    illustration.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                }
            });

            // Reset transform on mouse leave
            main.addEventListener('mouseleave', () => {
                if (illustration) {
                    illustration.style.transform = `rotateY(0deg) rotateX(0deg)`;
                }
            });
        });
    </script>
