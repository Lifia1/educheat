<script>
        const discussions = [
            {id:1, author:'Julian D.', category:'Ilmu Hukum', time:'2 jam yang lalu', title:'Relevansi teori utilitarianisme Bentham terhadap hukum siber?', summary:'Saya sedang mendalami bagaimana prinsip "the greatest happiness" berlaku dalam privasi data.', likes:24, replies:12},
            {id:2, author:'Anisa S.', category:'UI/UX', time:'5 jam yang lalu', title:'Bagaimana membuat prototipe usability test yang efektif?', summary:'Saya ingin tahu tahapan terstruktur untuk usability test pada aplikasi mobile.', likes:18, replies:8},
            {id:3, author:'Riko P.', category:'Data', time:'1 hari yang lalu', title:'Apa saja langkah awal untuk analisis data pengguna?', summary:'Saya butuh panduan praktis untuk memulai analisis perilaku user.', likes:12, replies:5}
        ];

        const discussionList = document.getElementById('discussionList');

        function renderDiscussions() {
            discussionList.innerHTML = discussions.map(topic => `
                <div class="bg-surface-container-lowest rounded-3xl border border-outline-variant p-md cursor-pointer hover:shadow-lg transition-shadow" onclick="location.href='discussion-detail.html?topic=${topic.id}'">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <p class="font-label-sm uppercase tracking-[0.18em] text-secondary">${topic.category}</p>
                            <h2 class="font-headline-h6 text-headline-h6 mt-xs text-primary">${topic.title}</h2>
                        </div>
                        <span class="font-label-sm text-on-surface-variant">${topic.time}</span>
                    </div>
                    <p class="font-body-sm text-on-surface-variant line-clamp-2">${topic.summary}</p>
                    <div class="flex gap-5 mt-4 text-sm text-on-surface-variant">
                        <span class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary text-[18px]">thumb_up</span>${topic.likes}</span>
                        <span class="flex items-center gap-2"><span class="material-symbols-outlined text-secondary text-[18px]">chat_bubble</span>${topic.replies} Jawaban</span>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('newTopicBtn').addEventListener('click', () => {
            const title = prompt('Judul topik diskusi baru:');
            if (!title) return;
            const category = prompt('Kategori topik:','Umum') || 'Umum';
            discussions.unshift({
                id: Date.now(),
                author: 'Anda',
                category,
                time: 'Baru saja',
                title,
                summary: 'Topik baru dibuat. Tambahkan deskripsi untuk mengekspresikan pertanyaan Anda.',
                likes: 0,
                replies: 0
            });
            renderDiscussions();
        });

        renderDiscussions();
    </script>
