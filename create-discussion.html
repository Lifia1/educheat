<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Diskusi - EduCheat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-accent min-h-screen pb-20">
  <header class="bg-white p-4 flex justify-between items-center sticky top-0">
    <h1 class="font-semibold text-xl">Buat Diskusi</h1>
    <button onclick="location.href='discussion.html'" class="bg-primary text-white px-6 py-2 rounded-2xl text-sm">Posting</button>
  </header>

  <main class="max-w-screen-xl mx-auto px-4 pt-6">
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2">Pilih Mata Kuliah</label>
      <div class="flex flex-wrap gap-2">
        <button class="bg-secondary text-white px-5 py-2 rounded-2xl text-sm">Matematika Dasar</button>
        <button class="bg-white px-5 py-2 rounded-2xl text-sm">Psikologi Kognitif</button>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-2">Judul Diskusi</label>
      <input type="text" placeholder="Misal: Cara cepat memahami Logaritma..." 
             class="w-full px-5 py-4 border border-gray-300 rounded-2xl">
    </div>

    <div class="mt-6">
      <label class="block text-sm font-medium mb-2">Apa yang ingin Anda tanyakan atau bagikan?</label>
      <textarea rows="8" placeholder="Tuliskan pemikiran atau pertanyaan akademis Anda..." 
                class="w-full px-5 py-4 border border-gray-300 rounded-3xl resize-none"></textarea>
    </div>
  </main>
</body>
</html>
